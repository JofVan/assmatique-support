name: Signaler un problème
description: Quelque chose ne fonctionne pas comme prévu.
labels: ["problème"]
body:
  - type: markdown
    attributes:
      value: "⚠️ Cette page est publique : n'écrivez aucune donnée personnelle (noms, adresses, montants, numéros)."
  - type: textarea
    id: description
    attributes:
      label: Que s'est-il passé ?
      description: Décrivez ce que vous faisiez et ce que vous avez constaté.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Qu'attendiez-vous ?
  - type: input
    id: version
    attributes:
      label: Version de l'app
      description: Visible dans Réglages › À propos.
  - type: dropdown
    id: role
    attributes:
      label: Vous êtes
      options: ["Parent employeur", "Assistante maternelle"]
